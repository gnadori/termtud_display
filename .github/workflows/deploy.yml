name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env from TERMTUD_DISPLAY_VAR
        env:
          RAW_ENV: ${{ secrets.TERMTUD_DISPLAY_VAR || vars.TERMTUD_DISPLAY_VAR }}
        run: |
          if [ -n "$RAW_ENV" ]; then
            printf '%s\n' "$RAW_ENV" | sed 's/ *= */=/' | grep -E '^[A-Za-z0-9_]+=' > .env
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
